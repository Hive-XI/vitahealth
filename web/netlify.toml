# Picked up after Netlify cds into web/ (base directory).
# Redirects here plus public/_redirects cover SPA routing and API proxy.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/*"
  to = "https://vitahealth-8o9h.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
