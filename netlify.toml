# App source is in web/ (Vite + React). Without this, Netlify deploys the
# repo root (README only) and shows its branded "Page not found" 404.

[build]
  base = "web"
  command = "npm run build"
  # Relative to base, so this publishes web/dist
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Proxy API calls to the Render Express service (must be above the SPA rule).
[[redirects]]
  from = "/api/*"
  to = "https://vitahealth-8o9h.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router. Deep links 404 without this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
